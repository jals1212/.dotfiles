onboarding = false

[keys]
prefix = "ctrl+a"

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = false
sidebar_collapsed_mode = "compact"
status_indicators = "dots"

[theme]
# >>> dots:theme >>>
name = "catppuccin"
# <<< dots:theme <<<
auto_switch = false

[ui.sidebar.agents]
# Default rows plus the two Gentle Shell active-work summary rows and the
# ci-local run ($ci, reported by @jals1212/ci-local-pi), colored by state, and
# the Pi space next to the agent ($space, reported by @jals1212/pi-spaces).
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent", "$space"],
  ["$summary",],
  ["$summary2"],
  [{ token = "$ci", rules = [
    { contains = "\u2717", fg = "#f38ba8" },
    { contains = "\u2713", fg = "#a6e3a1" },
    { contains = "\u29d7", fg = "#f9e2af" },
  ] }],
]

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true
