# Starship prompt — dots
# The prompt structure here is theme-independent. Per-theme colors live in the
# [palettes.*] tables below; the active palette is selected inside the
# dots:theme fence, which `./dots theme <theme> <flavor>` rewrites in place.
# Do not edit the fenced line by hand.

add_newline = false

format = """
$directory$git_branch$git_status$nodejs$golang$python$cmd_duration
$character"""

right_format = "$time"

# >>> dots:theme >>>
palette = "kanagawa_dragon"
# <<< dots:theme <<<

[directory]
style = "blue"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = ""

[git_branch]
style = "mauve"
symbol = ""
format = "[-> $branch]($style) "

[git_status]
style = "mauve"
format = "([$all_status$ahead_behind]($style) )"

[nodejs]
style = "green"
format = "[node $version]($style) "

[golang]
style = "teal"
format = "[go $version]($style) "

[python]
style = "peach"
format = "[py $version]($style) "

[cmd_duration]
min_time = 500
style = "yellow"
format = "[took $duration]($style) "

[time]
disabled = false
style = "gray"
time_format = "%H:%M"
format = "[$time]($style)"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

