# Dotfiles — Tmux
# Behavior/config only; look & feel lives in theme.conf.

# ── TPM bootstrap ─────────────────────────────────────
# Keep TPM/plugins under XDG config with the rest of tmux config.
# On a fresh machine, tmux clones TPM here and installs declared plugins on
# first start so no manual plugin bootstrap is needed. tmux-reset is cloned
# here too: it can't be a TPM plugin because TPM (initialized at the bottom)
# would execute the reset after this config and wipe it.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$XDG_CONFIG_HOME/tmux/plugins"
if "test ! -d ${TMUX_PLUGIN_MANAGER_PATH}/tpm" \
   "run-shell 'git clone https://github.com/tmux-plugins/tpm ${TMUX_PLUGIN_MANAGER_PATH}/tpm && ${TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'"
if "test ! -d ${TMUX_PLUGIN_MANAGER_PATH}/tmux-reset" \
   "run-shell 'git clone https://github.com/hallazzang/tmux-reset ${TMUX_PLUGIN_MANAGER_PATH}/tmux-reset'"

# ── Full reset ────────────────────────────────────────
# Every option and key binding back to tmux defaults before anything is set,
# so re-sourcing this file is fully idempotent (removed options/binds don't
# linger). hallazzang/tmux-reset (MIT); -q skips it quietly on the very
# first boot, before the clone above lands.
source -q "${TMUX_PLUGIN_MANAGER_PATH}/tmux-reset/tmux-reset"

# ── Plugins ───────────────────────────────────────────
# tpm manages the list below; tmux-sensible provides safe defaults, yank
# integrates copy-mode with the system clipboard, navigator shares movement
# keys with Vim/Neovim, and resurrect/continuum preserve sessions on demand.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jals1212/themux'  # The source is directly in the plugins directory because is in active development.
set -g @plugin 'alexwforsythe/tmux-which-key'

# Restore sessions automatically.
set -g @continuum-restore 'off'

# ── Look & feel ───────────────────────────────────────
# Theme, status modules, and window styling (themux). Must come before the
# TPM init at the bottom so tmux-cpu can interpolate the status line.
source ~/.config/tmux/theme.conf

# ── Terminal & key handling ───────────────────────────
# Advertise 24-bit color, true RGB, styled underlines, hyperlinks, and extended
# keys so modern terminals and Neovim receive the key/color data they expect.
set -g default-terminal 'tmux-256color'
set -sa terminal-overrides ',xterm*:Tc'
set -as terminal-features ',*:RGB'
set -as terminal-features ',*:usstyle'
set -as terminal-features ',*:hyperlinks'
set -as terminal-features 'xterm*:extkeys'
set -s extended-keys on
set -s extended-keys-format csi-u
# Keep escape responsive in Vim/Neovim while still allowing Alt/meta key chords.
set -sg escape-time 10

# ── Prefix & reload ───────────────────────────────────
# Prefix is Ctrl-a instead of tmux's default Ctrl-b.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# Reload this file with `prefix + r` after manual edits.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# ── General behavior ──────────────────────────────────
# Mouse support allows pane selection, resizing, and scrollback with the mouse.
set -g mouse on
# Start windows/panes at 1 so indexes match common keyboard shortcuts.
set -g base-index 1
set -g pane-base-index 1
# Keep window numbers compact after closing windows and avoid shell-renamed tabs.
set -g renumber-windows on
set -g allow-rename off
# Keep tmux quiet: no visual bells/activity markers unless explicitly enabled.
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# ── Copy mode ─────────────────────────────────────────
# Vim-style copy mode: `prefix + [` enters copy mode, then use vi motions.
# `v` starts selection, `Ctrl-v` toggles rectangle selection, and `y` copies.
set -g mode-keys vi
set -g set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# ── Pane navigation ───────────────────────────────────
# Vim-like pane movement with prefix+h/j/k/l.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Alt+arrows move between panes without pressing prefix.
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ── Pane resize ───────────────────────────────────────
# Resize panes with prefix+H/J/K/L; `-r` makes repeated presses continue sizing.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Pane splits & new windows ─────────────────────────
# Splits and new windows start in the current pane's directory.
# prefix+v/| split horizontally, prefix+d/- split vertically, prefix+c opens
# a new window in the same path.
unbind %
unbind '"'
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind "\\" split-window -h -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind _ split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# ── Pane sync ─────────────────────────────────────────
# Toggle synchronized panes with prefix+e when you need to type in all panes.
bind e setw synchronize-panes \; display-message "sync #{?pane_synchronized,on,off}"

# ── Window navigation ─────────────────────────────────
# Window nav: prefix+Shift+arrows or Alt+H/L (no prefix).
# Shift+arrow stays free for terminal text selection.
bind S-Left previous-window
bind S-Right next-window
bind -n M-H previous-window
bind -n M-L next-window
# Jump to last window/session quickly.
bind Tab last-window
bind BSpace switch-client -l
# Fast layout presets with prefix+Alt+1..5.
bind M-1 select-layout even-horizontal
bind M-2 select-layout even-vertical
bind M-3 select-layout main-horizontal
bind M-4 select-layout main-vertical
bind M-5 select-layout tiled

# ── fzf pickers ───────────────────────────────────────
# prefix+f switches sessions through fzf; prefix+w switches any window.
bind f display-popup -E -w 80% -h 70% 'tmux list-sessions -F "#S" | fzf --reverse | xargs -r tmux switch-client -t'
bind w display-popup -E -w 80% -h 70% 'tmux list-windows -a -F "#S:#I #W" | fzf --reverse | awk "{print \$1}" | xargs -r tmux switch-client -t'

# ── Scratch & maintenance ─────────────────────────────
# Alt+g toggles a persistent scratch session in a popup. Run it from the
# scratch session to detach; run it elsewhere to open the popup.
bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' { \
  detach-client \
} { \
  display-popup -d '#{pane_current_path}' -w 80% -h 80% -E -k 'tmux new-session -A -s scratch' \
}
# prefix+K closes every other session after confirmation.
bind K confirm-before -p 'Kill all other sessions? (y/n)' 'kill-session -a'

# Initialize TPM (keep this at the bottom).
# TPM must run after plugin declarations and before status extensions.
run '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'
