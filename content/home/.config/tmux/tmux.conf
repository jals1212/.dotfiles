# Dotfiles — Tmux (behavior; look & feel in theme.conf)

# ── Paths ─────────────────────────────────────────────
# This config's dir; reference it with -F and #{TMUX_PATH} in source.
set-environment -gF TMUX_PATH "#{d:current_file}"
set-environment -gF TMUX_PLUGIN_MANAGER_PATH "#{TMUX_PATH}/plugins"

# ── Plugins (TPM) ─────────────────────────────────────
if "test ! -d ${TMUX_PLUGIN_MANAGER_PATH}/tpm" \
   "run-shell 'git clone https://github.com/tmux-plugins/tpm ${TMUX_PLUGIN_MANAGER_PATH}/tpm && ${TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'"
   
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jals1212/themux'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @continuum-restore 'off'
set -g @resurrect-capture-pane-contents 'on'

# ── Look & feel ───────────────────────────────────────
# Before TPM init so tmux-cpu can interpolate the status line.
source -F "#{TMUX_PATH}/theme.conf"

# ── Terminal & keys ───────────────────────────────────
set -g default-terminal 'tmux-256color'
set -sa terminal-overrides ',xterm*:Tc'
set -as terminal-features ',*:RGB'
set -as terminal-features ',*:usstyle'
set -as terminal-features ',*:hyperlinks'
set -as terminal-features 'xterm*:extkeys'
set -s extended-keys on
set -s extended-keys-format csi-u
set -sg escape-time 10

# ── Prefix ───────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ───────────────────────────────────────────
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g display-time 2000
set -g allow-rename off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none
# Rename: blank prompt when window names are in "themux manual mode", else prefilled.
bind , command-prompt -I "#{?#{==:#{@themux_window_name_mode},manual},,#W}" { rename-window -- "%%" }

# ── Copy mode (vi) ────────────────────────────────────
set -g mode-keys vi
set -g set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# ── Pane navigation ───────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ── Pane resize ───────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Splits & windows (keep cwd) ───────────────────────
unbind %
unbind '"'
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind "\\" split-window -h -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind _ split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Toggle synchronized panes.
bind e setw synchronize-panes \; display-message "sync #{?pane_synchronized,on,off}"

# ── Window navigation ─────────────────────────────────
bind S-Left previous-window
bind S-Right next-window
bind -n M-H previous-window
bind -n M-L next-window
bind Tab last-window
bind BSpace switch-client -l
bind M-1 select-layout even-horizontal
bind M-2 select-layout even-vertical
bind M-3 select-layout main-horizontal
bind M-4 select-layout main-vertical
bind M-5 select-layout tiled

# ── fzf pickers (session / window) ────────────────────
bind f display-popup -E -w 80% -h 70% 'tmux list-sessions -F "#S" | fzf --reverse | xargs -r tmux switch-client -t'
bind w display-popup -E -w 80% -h 70% '~/.config/tmux/scripts/session-picker.sh'

# ── LazyGit popup ─────────────────────────────────────
bind g display-popup -d '#{pane_current_path}' -E -w 80% -h 80% 'lazygit'

# ── Scratch & maintenance ─────────────────────────────
# Alt+g: toggle a scratch popup (run inside scratch to detach).
bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' { \
  detach-client \
} { \
  display-popup -d '#{pane_current_path}' -w 80% -h 80% -E -k 'tmux new-session -A -s scratch' \
}
# X (not K: K is resize-pane up above).
bind X confirm-before -p 'Kill all other sessions? (y/n)' 'kill-session -a'

# Initialize TPM (keep at the bottom).
run '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'
