# Dotfiles — Tmux (behavior; look & feel in theme.conf)

# ── Paths ─────────────────────────────────────────────
# This config's dir; reference it with -F and #{TMUX_PATH} in source.
set-environment -gF TMUX_PATH "#{d:current_file}"
set-environment -gF TMUX_PLUGIN_MANAGER_PATH "#{TMUX_PATH}/plugins"

# ── Plugins (TPM) ─────────────────────────────────────
# Pinned like the zsh plugins (zsh/plugins.zsh): TPM only follows branches, so
# the `# pin <sha>` line above each @plugin is the exact commit that
# scripts/pin-plugins.sh clones or checks out BEFORE TPM loads anything (this
# also installs TPM itself on a fresh machine). To bump one, replace its sha
# with a newer upstream commit and reload (`tmux source ~/.config/tmux/tmux.conf`).
# `prefix + U` (TPM update) moves a plugin off its pin until the next reload.
run-shell "sh '#{TMUX_PATH}/scripts/pin-plugins.sh' '#{TMUX_PATH}/tmux.conf' '#{TMUX_PLUGIN_MANAGER_PATH}'"

# pin e261deb1b47614eed3400089ce7197dc68acc4eb
set -g @plugin 'tmux-plugins/tpm'
# pin 25cb91f42d020f675bb0a2ce3fbd3a5d96119efa
set -g @plugin 'tmux-plugins/tmux-sensible'
# pin acfd36e4fcba99f8310a7dfb432111c242fe7392
set -g @plugin 'tmux-plugins/tmux-yank'
# pin cff343cf9e81983d3da0c8562b01616f12e8d548
set -g @plugin 'tmux-plugins/tmux-resurrect'
# pin 0698e8f4b17d6454c71bf5212895ec055c578da0
set -g @plugin 'tmux-plugins/tmux-continuum'
# pin bcb110d754ab2417de824c464730c412a3eb2769
set -g @plugin 'tmux-plugins/tmux-cpu'
# pin e41c431a0c7b7388ae7ba341f01a0d217eb3a432
set -g @plugin 'christoomey/vim-tmux-navigator'
# pin ce47b6e57fb35d02cb20ca69549769df50c577fa
set -g @plugin 'jals1212/themux'
# pin 85fb9756447b989f3b94e515d1e6ee7fec76cba2
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @continuum-restore 'off'
set -g @resurrect-capture-pane-contents 'on'

# ── Look & feel ───────────────────────────────────────
# Before TPM init so tmux-cpu can interpolate the status line.
source -F "#{TMUX_PATH}/theme.conf"

# ── Terminal & keys ───────────────────────────────────
set -g default-terminal 'tmux-256color'
set -sa terminal-overrides ',xterm*:Tc'
set -as terminal-features ',*:RGB'
set -as terminal-features ',*:usstyle'
set -as terminal-features ',*:hyperlinks'
set -as terminal-features 'xterm*:extkeys'
set -s extended-keys on
set -s extended-keys-format csi-u
set -sg escape-time 10

# ── Prefix ───────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ───────────────────────────────────────────
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g display-time 2000
set -g allow-rename off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none
# Rename: blank prompt when window names are in "themux manual mode", else prefilled.
bind , command-prompt -I "#{?#{==:#{@themux_window_name_mode},manual},,#W}" { rename-window -- "%%" }

# ── Copy mode (vi) ────────────────────────────────────
set -g mode-keys vi
set -g set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# ── Pane navigation ───────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ── Pane resize ───────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Splits & windows (keep cwd) ───────────────────────
unbind %
unbind '"'
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind "\\" split-window -h -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind _ split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Toggle synchronized panes.
bind e setw synchronize-panes \; display-message "sync #{?pane_synchronized,on,off}"

# ── Window navigation ─────────────────────────────────
bind S-Left previous-window
bind S-Right next-window
bind -n M-H previous-window
bind -n M-L next-window
bind Tab last-window
bind BSpace switch-client -l
bind M-1 select-layout even-horizontal
bind M-2 select-layout even-vertical
bind M-3 select-layout main-horizontal
bind M-4 select-layout main-vertical
bind M-5 select-layout tiled

# ── fzf pickers (session / window) ────────────────────
bind f display-popup -E -w 80% -h 70% 'tmux list-sessions -F "#S" | fzf --reverse | xargs -r tmux switch-client -t'
bind w display-popup -E -w 80% -h 70% '~/.config/tmux/scripts/session-picker.sh'

# ── LazyGit popup ─────────────────────────────────────
bind g display-popup -d '#{pane_current_path}' -E -w 80% -h 80% 'lazygit'

# ── Scratch & maintenance ─────────────────────────────
# Alt+g: toggle a scratch popup (run inside scratch to detach).
bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' { \
  detach-client \
} { \
  display-popup -d '#{pane_current_path}' -w 80% -h 80% -E -k 'tmux new-session -A -s scratch' \
}
# X (not K: K is resize-pane up above).
bind X confirm-before -p 'Kill all other sessions? (y/n)' 'kill-session -a'

# Initialize TPM (keep at the bottom).
run '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'
