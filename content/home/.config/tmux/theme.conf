# Dotfiles — Tmux look & feel (themux). Safe to re-source; themux self-resets.

# ── Theme (DOTS_THEME, set by ./dots theme) ───────────
%if "${DOTS_THEME}"
set -g @themux_theme "${DOTS_THEME}"
%else
set -g @themux_theme 'kanagawa_dragon'
%endif

# ── Style ─────────────────────────────────────────────
set -g @themux_status_variant "rounded"
set -g @themux_windows_variant "rounded"
set -g @themux_panes_variant "rounded"
set -g @themux_status_background "none"
set -g @themux_pane_status "top" # off | top | bottom

# ── Composition (space = adjacent, | = divider) ───────
set -g @themux_status_left_modules "session application directory zoom"
set -g @themux_status_right_modules "gitmux ram date_time"

# ── Load themux ───────────────────────────────────────
run "#{TMUX_PLUGIN_MANAGER_PATH}/themux/themux.tmux"

# ── Status bar (themux owns `status`, don't set it here) ──
set -g status-position top
set -g clock-mode-style 24
set -g status-left-length 100
set -g status-right-length 100
set -g pane-border-lines single
set -wg automatic-rename on
