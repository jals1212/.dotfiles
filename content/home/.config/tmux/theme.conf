# Dotfiles — Tmux look & feel (themux)
# Sourced from tmux.conf. Safe to re-source on a live server: it starts with
# the themux reset, which wipes all theme-derived state before rebuilding, so
# theme/style switches never need `tmux kill-server`.

# ── Reset ─────────────────────────────────────────────
# -q skips it quietly on the very first boot, before TPM installs themux.
source -q "#{TMUX_PLUGIN_MANAGER_PATH}/themux/themux_reset.conf"

# ── Theme ─────────────────────────────────────────────
# Format: theme_variant (kanagawa_dragon, catppuccin_mocha, etc.)
# The active choice is DOTS_THEME — machine-local state written by
# `./dots theme` to ~/.config/zsh/local.zsh, whose theme_flavor values match
# themux theme names. On a theme switch `./dots theme` refreshes the server's
# environment and re-sources the config.
%if "${DOTS_THEME}"
set -g @themux_theme "${DOTS_THEME}"
%else
set -g @themux_theme 'kanagawa_dragon'
%endif

# ── Themux style ──────────────────────────────────────
set -g @themux_status_background "none"

# Variants per item; window list on its own status line. Flat panes give
# surface_0/overlay_0 borders, matching the status separator color.
set -g @themux_status_variant "pill"
set -g @themux_windows_variant "flat"
set -g @themux_panes_variant "flat"
set -g @themux_windows_line "2"

# Module overrides
set -g @themux_directory_text " #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}}"

# Window titles show ": Name" only when the window was explicitly renamed.
set -g @themux_window_text "#{?#{!=:#{window_name},Window},: #W,}"
set -g @themux_window_current_text "#{?#{!=:#{window_name},Window},: #W,}"

# ── Load themux ───────────────────────────────────────
run "#{TMUX_PLUGIN_MANAGER_PATH}/themux/themux.tmux"

# ── Status bar ────────────────────────────────────────
# themux owns the `status` line count (@themux_windows_line); don't set
# `status` here — on a re-source the plugin's `run` executes in line order
# and a later `status on` would override it.
# set -g status on
set -g status-position top
set -g clock-mode-style 24
set -g status-left-length 100
set -g status-right-length 100
set -g status-justify "absolute-centre"

# Status left
set -g status-left ""
set -ga status-left "#{E:@themux_status_session}"
set -ga status-left "#{E:@themux_status_separator}"
set -ga status-left "#{E:@themux_status_application}"
set -ga status-left "#{E:@themux_status_separator}"
set -ga status-left "#{E:@themux_status_directory}"
set -ga status-left " #{E:@themux_status_zoom}"

# Status right
set -g status-right ""
set -ag status-right "#{E:@themux_status_gitmux}"
set -ga status-right "#{E:@themux_status_separator}"
set -agF status-right '#{E:@themux_status_ram}'
set -ga status-right "#{E:@themux_status_separator}"
set -ga status-right "#{E:@themux_status_date_time}"

# Window status
set -wg automatic-rename on
set -g automatic-rename-format "Window"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"

# Panes and borders
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-border-lines single
