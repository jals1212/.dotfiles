# Dotfiles — Tmux look & feel (themux). Safe to re-source; themux self-resets.

# ── Theme (DOTS_THEME, set by ./dots theme) ───────────
%if "${DOTS_THEME}"
set -g @themux_theme "${DOTS_THEME}"
%else
set -g @themux_theme 'kanagawa_dragon'
%endif

# ── Style ─────────────────────────────────────────────
# naked | rounded | squared | slanted
set -g @themux_module_variant "squared"
set -g @themux_window_variant "squared"
set -g @themux_window_text_mode "manual"
set -g @themux_status_background "none"

# ── Composition (space = adjacent, | = divider) ───────
set -g @themux_module_divider " "
set -g @themux_window_divider " "
set -g @themux_status_line_1 "session|application|directory|zoom/gitmux|ram|date_time"
set -g @themux_status_line_2 "/windows/"

# ── Load themux ───────────────────────────────────────
run "#{TMUX_PLUGIN_MANAGER_PATH}/themux/themux.tmux"

# ── Status bar (themux owns `status`, don't set it here) ──
set -g status-position top
set -g clock-mode-style 24
set -g status-left-length 100
set -g status-right-length 100
