# Dotfiles — Tmux look & feel (themux). Safe to re-source; themux self-resets.

# ── Theme (DOTS_THEME, set by ./dots theme) ───────────
%if "${DOTS_THEME}"
set -g @themux_theme "${DOTS_THEME}"
%else
set -g @themux_theme 'kanagawa_dragon'
%endif

# ── Style and Composition ─────────────────────────────────────────────
set -g @themux_status_line_1 "=session>application>directory>zoom/cpu<ram<time="
set -g @themux_status_line_2 "=windows/gitmux="
set -g @themux_status_background "none"
set -g @themux_all_shape "powerline"
set -g @themux_all_notch "on"
set -g @themux_window_seam "<>"
set -g @themux_window_name_mode "manual"
set -g @themux_pane_status "top"

# ── Reload themux ───────────────────────────────────────
# Clean reload: themux binds prefix + r to unset every @themux_* (so options you
# remove or change revert to default) then re-source the whole tmux.config.
set -g @themux_reload_key "r"

# ── Load themux ───────────────────────────────────────
run "#{TMUX_PLUGIN_MANAGER_PATH}/themux/themux.tmux"

# ── Status bar (themux owns `status`, don't set it here) ──
set -g status-position top
set -g status-left-length 100
set -g status-right-length 100
set -g clock-mode-style 24
