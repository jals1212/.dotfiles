# Dotfiles — Tmux look & feel (themux)
# Sourced from tmux.conf. Safe to re-source on a live server: it starts with
# the themux reset, which wipes all theme-derived state before rebuilding, so
# theme/style switches never need `tmux kill-server`.

# ── Reset ─────────────────────────────────────────────
# -q skips it quietly on the very first boot, before TPM installs themux.
source -q "#{TMUX_PLUGIN_MANAGER_PATH}/themux/themux_reset.conf"

# ── Theme ─────────────────────────────────────────────
# The active choice is DOTS_THEME — machine-local state written by
# `./dots theme` to ~/.config/zsh/local.zsh, whose theme_flavor values match
# themux theme names. On a theme switch `./dots theme` refreshes the server's
# environment and re-sources the config.
%if "${DOTS_THEME}"
set -g @themux_theme "${DOTS_THEME}"
%else
set -g @themux_theme 'kanagawa_dragon'
%endif

# ── Style ─────────────────────────────────────────────
# Solid squared blocks on a transparent bar. Window list inline.
set -g @themux_status_variant "rounded"
set -g @themux_windows_variant "rounded"
set -g @themux_panes_variant "rounded"
set -g @themux_status_background "none"
# Show a styled label (index + path) on each pane border — this is where the
# panes variant's caps/blocks appear. themux builds pane-border-format, so the
# blank override (commented out below) must stay off.
set -g @themux_pane_status_enabled "yes"

# ── Composition ───────────────────────────────────────
# Declarative module lists. Space = adjacency (squared blocks separate
# themselves); a "|" between two modules would insert a divider.
set -g @themux_status_left_modules "session application directory zoom"
set -g @themux_status_right_modules "gitmux ram date_time"

# ── Load themux ───────────────────────────────────────
run "#{TMUX_PLUGIN_MANAGER_PATH}/themux/themux.tmux"

# ── Status bar ────────────────────────────────────────
# themux owns the `status` line count (@themux_windows_line); don't set
# `status` here — on a re-source the plugin's `run` runs in line order and a
# later `status on` would override it.
set -g status-position top
set -g clock-mode-style 24
set -g status-left-length 100
set -g status-right-length 100

# Panes and borders
set -g pane-border-status top
# set -g pane-border-format ""
set -g pane-border-lines single
set -wg automatic-rename on
