# Dotfiles — mise
# Run `./dots update` (or `./dots upgrade` to prune removed versions) after edits.

[tools]
# "latest" on purpose: a fresh install gets the newest release, so two
# machines can differ. Pin a version here (or per project) when that matters.
dotnet = "latest"
go = "latest"
node = "latest"
pnpm = "latest"
python = "latest"
ruby = "latest"
rust = "latest"

# Global npm CLIs. Declared here (npm: backend) instead of `npm i -g` so they
# live outside node's own install dir and survive Node version changes.
"npm:@colbymchenry/codegraph" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
# Own package; approved past aube's new-package age gate.
"npm:pi-spaces-cli" = { version = "latest", allow_low_downloads = true }
"npm:gentle-pi" = "latest"
"npm:neon" = "latest"
# vercel stays in the Brewfile: since 58.5.1 its npm releases lack SLSA
# provenance, which aube's trust policy (rightly) refuses.

[settings]
idiomatic_version_file_enable_tools = ["node"]
# Own global CLIs install their newest release at once, without the
# release-age wait. Needs exact tool names (npm:@jals1212/* does not match),
# so add each new own global tool here.
minimum_release_age_excludes = ["npm:pi-spaces-cli"]

[settings.ruby]
compile = false
