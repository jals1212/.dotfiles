# Dotfiles — Atuin
# Theme: DOTS_THEME/DOTS_FLAVOR

[theme]
name = "dots"

## keybindings
## Ctrl-R/Ctrl-P open global fuzzy search; Up opens session shell history.
ctrl_n_shortcuts = false

## search mode
search_mode = "fuzzy"
filter_mode = "global"
search_mode_shell_up_key_binding = "prefix"
filter_mode_shell_up_key_binding = "session"
keymap_mode = "auto"

## style
style = "auto"
inline_height = 0
enter_accept = true
show_preview = true
show_tabs = true

## sync — local only
auto_sync = false
sync_frequency = "0"
update_check = false
secrets_filter = true

[search]
filters = ["global", "host", "session", "session-preload", "workspace", "directory"]

[tmux]
enabled = false
