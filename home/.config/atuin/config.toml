# Dotfiles — Atuin
# Theme: Catppuccin Mocha

[theme]
name = "catppuccin-CATPPUCCIN_FLAVOR-mauve"

## keybindings
## ctrl-r to open atuin search
## up arrow for interactive history
ctrl_n = false

## search mode
filter_mode = "global"
filter_mode_shell_up_key_binding = "session"

## style
style = "auto"
inline_height = 0

## sync — local only
auto_sync = false
sync_address = ""
sync_frequency = "0"