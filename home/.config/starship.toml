# Dotfiles — Starship Prompt
# Theme: Catppuccin Mocha

format = """\
$directory\
$os\
$git_branch\
$fill\
$nodejs\
$rust\
$golang\
$php\
$java\
$c\
$python\
$cmd_duration\
$time\
\n$character\
"""

add_newline = true
command_timeout = 3600000
palette = "catppuccin_mocha"

[fill]
symbol = ' '

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[N](bold fg:red)"

[directory]
format = "[$path](bold fg:blue)[$read_only]($read_only_style) "
truncation_length = 2
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " 🔒"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
format = "[$symbol$branch]($style) "
style = "bold fg:mauve"
symbol = " "

[cmd_duration]
format = "[$duration]($style) "
style = "bold fg:yellow"
min_time = 500

[nodejs]
symbol = ""
format = "[$symbol($version)](fg:green) "

[rust]
symbol = ""
format = "[$symbol($version)](fg:red) "

[golang]
symbol = ""
format = "[$symbol($version)](fg:teal) "

[python]
symbol = ""
format = "[$symbol($version)](fg:peach) "

[java]
symbol = ""
format = "[$symbol($version)](fg:red) "

[c]
symbol = ""
format = "[$symbol($version)](fg:blue) "

[time]
disabled = false
time_format = "%H:%M"
format = "[ $time](fg:subtext0)"