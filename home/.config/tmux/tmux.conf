# Dotfiles — Tmux
# Theme: DOTS_THEME_FLAVOR via tmux-ukiyo

# ── TPM bootstrap ─────────────────────────────────────
# Keep TPM/plugins under XDG config with the rest of tmux config.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run-shell 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# ── Plugins ───────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'Nybkox/tmux-ukiyo'

# ── Ukiyo theme ───────────────────────────────────────
# Format: theme/flavor (kanagawa/dragon, catppuccin/mocha, etc.)
# prefix + T opens Ukiyo's interactive theme menu.
set -g @ukiyo-theme 'DOTS_THEME_FLAVOR'
set -g @ukiyo-plugins "git cpu-usage ram-usage"
set -g @ukiyo-ignore-window-colors true
set -g @ukiyo-show-powerline true
set -g @ukiyo-refresh-rate 5

# ── Terminal & key handling ───────────────────────────
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"
set -as terminal-features ",*:hyperlinks"
set -as terminal-features 'xterm*:extkeys'
set -s extended-keys on
set -s extended-keys-format csi-u
set -sg escape-time 10

# ── General behavior ──────────────────────────────────
set -g mouse on
set -g status on
set -g status-position top
set -g clock-mode-style 24
set -g status-left-length 100
set -g status-right-length 100
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim mode
set -g mode-keys vi
set -g set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Restore sessions automatically.
set -g @continuum-restore 'on'

# ── Prefix & reload ───────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# ── Pane/window navigation ────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n M-H previous-window
bind -n M-L next-window

# Resize (repeatable, 5 cells per press)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Synchronize-panes toggle
bind e setw synchronize-panes \; display-message "sync #{?pane_synchronized,on,off}"

# Last-window / last-session
bind Tab last-window
bind BSpace switch-client -l

# Layouts
bind M-1 select-layout even-horizontal
bind M-2 select-layout even-vertical
bind M-3 select-layout main-horizontal
bind M-4 select-layout main-vertical
bind M-5 select-layout tiled

# ── fzf pickers ───────────────────────────────────────
bind f display-popup -E -w 80% -h 70% "tmux list-sessions -F '#S' | fzf --reverse | xargs -r tmux switch-client -t"
bind w display-popup -E -w 80% -h 70% "tmux list-windows -a -F '#S:#I #W' | fzf --reverse | awk '{print \$1}' | xargs -r tmux switch-client -t"

# ── Splits/current path ───────────────────────────────
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Scratch & maintenance ─────────────────────────────
bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' { \
  detach-client \
} { \
  display-popup -d "#{pane_current_path}" -w 80% -h 80% -E -k "tmux new-session -A -s scratch" \
}
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

# Initialize TPM (keep this at the bottom).
run '~/.config/tmux/plugins/tpm/tpm'

# ── Status indicators ────────────────────────────────
# Appended after TPM so ukiyo's status-right is set before we extend it.
set -ag status-right '#{?client_prefix,#[fg=yellow]·PREFIX·#[default],}'
set -ag status-right '#{?pane_synchronized,#[fg=red]·SYNC·#[default],}'
