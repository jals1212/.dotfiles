# Clone TPM if it doesn't exist
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# --- General Tmux Settings ---
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# --- Custom Key Bindings ---
# Change prefix key to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config with prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Use vim-like keys to switch panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + arrow keys to switch panes without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift + Left/Right to switch windows without prefix
bind -n S-Left  previous-window
bind -n S-Right next-window

# Alt + H/L to switch windows without prefix
bind -n M-H previous-window
bind -n M-L next-window

# Use vim keybindings in copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Split panes using | and - with current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Create new windows with current path
bind c new-window -c "#{pane_current_path}"

# Floating scratch window
bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' { detach-client } { display-popup -d "#{pane_current_path}" -E "tmux new-session -A -s scratch" }

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm' # Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tmux-sensible' # Basic tmux settings everyone can agree on
set -g @plugin 'tmux-plugins/tmux-resurrect' # Save and restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-continuum' # Automatically save tmux sessions every 15 minutes
set -g @plugin 'tmux-plugins/tmux-yank' # Copy to system clipboard using tmux
# set -g @plugin 'tmux-plugins/tmux-battery' # Show battery status in tmux
# set -g @plugin 'tmux-plugins/tmux-cpu' # Show CPU usage in tmux
set -g @plugin 'christoomey/vim-tmux-navigator' # Seamless navigation between tmux and vim panes
set -g @plugin 'alexwforsythe/tmux-which-key' # Which-key for tmux
set -g @plugin 'catppuccin/tmux' # Catppuccin theme for tmux

# Tmux Resurrect settings
set -g @continuum-restore 'on'

# Catppuccin theme settings
set -g @catppuccin_flavour 'CATPPUCCIN_FLAVOR' # latte, frappe, macchiato or mocha
# set -g @catppuccin_reset "true"
set -g @catppuccin_window_status_style "rounded" # basic, rounded, slanted, custom, or none

# --- Status Bar Customization ---
set -g status on
set -g status-position top
set -g clock-mode-style 24
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
# set -agF status-right "#{E:@catppuccin_status_ram}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
# set -agF status-right "#{E:@catppuccin_status_battery}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
