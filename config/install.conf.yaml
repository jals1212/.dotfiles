# ── Defaults ──────────────────────────────────────────────────────────────────
# force + backup: first run on an existing tar-copy install displaces regular
# files to <target>.dotbot-backup.<timestamp> before symlinking.
# relink: idempotent re-runs replace stale/wrong symlinks without error.
# create: parent directories are created on demand.
# canonicalize: false so that dotbot resolves relative to BASEDIR, not realpath.
- defaults:
    link:
      force: true
      relink: true
      create: true
      backup: true
      canonicalize: false

# ── Pre-flight ─────────────────────────────────────────────────────────────────
# Install Homebrew when missing.  Interactive (no NONINTERACTIVE=1) per §1.7.
# The shell directive is a no-op when brew is already on PATH.
- shell:
  - description: Install Homebrew if missing
    command: |
      if ! command -v brew >/dev/null 2>&1; then
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      fi
    quiet: true
    stderr: true
    stdout: true

# ── Brew ───────────────────────────────────────────────────────────────────────
# dotbot-brew plugin: runs `brew bundle --file=config/Brewfile`.
# Path is resolved relative to BASEDIR (set by ./install via -d).
- brewfile:
  - config/Brewfile

# ── Parent directories ─────────────────────────────────────────────────────────
# Ensure every ~/.config/<app>/ directory exists before the link block runs.
- create:
  - ~/.local/share/zinit
  - ~/.local/state/zsh
  - ~/.cache/zsh
  - ~/.config/zsh
  - ~/.config/nvim
  - ~/.config/tmux
  - ~/.config/ghostty
  - ~/.config/herdr
  - ~/.config/aerospace
  - ~/.config/mise
  - ~/.config/bat
  - ~/.config/bat/themes
  - ~/.config/eza
  - ~/.config/fzf
  - ~/.config/lazygit
  - ~/.config/bottom
  - ~/.config/duti
  - ~/.config/remote-agents

# ── Symlinks ───────────────────────────────────────────────────────────────────
# Every non-theme file under home/ mapped to its $HOME counterpart.
# Entries inherit the defaults block above unless overridden per-entry.
# OS-conditional entries use if: (shell predicate; zero exit = proceed).
- link:
    # Shell entry points
    ~/.zshenv: content/home/.zshenv
    ~/.config/zsh/.zshenv: content/home/.config/zsh/.zshenv
    ~/.config/zsh/.zprofile: content/home/.config/zsh/.zprofile
    ~/.config/zsh/.zshrc: content/home/.config/zsh/.zshrc

    # Zsh config fragments
    ~/.config/zsh/zinit.zsh: content/home/.config/zsh/zinit.zsh
    ~/.config/zsh/aliases.zsh: content/home/.config/zsh/aliases.zsh
    ~/.config/zsh/abbr.zsh: content/home/.config/zsh/abbr.zsh
    ~/.config/zsh/functions.zsh: content/home/.config/zsh/functions.zsh
    ~/.config/zsh/keymaps.zsh: content/home/.config/zsh/keymaps.zsh
    ~/.config/zsh/tools.zsh: content/home/.config/zsh/tools.zsh
    ~/.config/zsh/prompt.zsh: content/home/.config/zsh/prompt.zsh
    ~/.config/zsh/p10k.zsh: content/home/.config/zsh/p10k.zsh
    ~/.config/zsh/plugins.zsh: content/home/.config/zsh/plugins.zsh

    # Tool-owned shell/config entrypoints
    ~/.config/fzf/config.zsh: content/home/.config/fzf/config.zsh
    ~/.config/eza/config.zsh: content/home/.config/eza/config.zsh
    ~/.config/bat/config: content/home/.config/bat/config

    # Starship prompt — static base config; theme palette is switched in place
    # via the dots:theme fenced marker by `./dots theme`, not a per-theme link.
    ~/.config/starship.toml: content/home/.config/starship.toml

    # Neovim — direct children are linked via glob so new top-level config
    # files do not need one Dotbot entry each.
    ~/.config/nvim:
      glob: true
      path: content/home/.config/nvim/*
    ~/.config/nvim/:
      glob: true
      path: content/home/.config/nvim/.*

    # Tmux
    ~/.config/tmux/tmux.conf: content/home/.config/tmux/tmux.conf
    ~/.config/tmux/theme.conf: content/home/.config/tmux/theme.conf
    ~/.config/tmux/scripts/session-picker.sh: content/home/.config/tmux/scripts/session-picker.sh

    # Herdr
    ~/.config/herdr/config.toml: content/home/.config/herdr/config.toml

    # Ghostty — config file + shaders directory link
    ~/.config/ghostty/config: content/home/.config/ghostty/config
    ~/.config/ghostty/shaders: content/home/.config/ghostty/shaders


    # Mise — linked before the mise: directive so mise install reads the XDG path
    ~/.config/mise/config.toml: content/home/.config/mise/config.toml

    # Aerospace — macOS only (if: predicate prevents link on Linux)
    ~/.config/aerospace/aerospace.toml:
      path: content/home/.config/aerospace/aerospace.toml
      if: '[ "$(uname)" = Darwin ]'

    # duti — VSCodium default-app associations, macOS only
    ~/.config/duti/vscodium.duti:
      path: content/home/.config/duti/vscodium.duti
      if: '[ "$(uname)" = Darwin ]'

    # Remote agents — SSH key hardening run by the moshi-pair zsh function, macOS only
    ~/.config/remote-agents/harden-authorized-keys.sh:
      path: content/home/.config/remote-agents/harden-authorized-keys.sh
      if: '[ "$(uname)" = Darwin ]'

    # Finder Quick Action "Open in VSCodium" (right-click > Quick Actions), macOS only
    "~/Library/Services/Open in VSCodium.workflow":
      path: "content/home/Library/Services/Open in VSCodium.workflow"
      if: '[ "$(uname)" = Darwin ]'

# ── Default apps (macOS) ───────────────────────────────────────────────────────
# Register VSCodium as the default GUI app for code/text files via duti.
# Guarded: no-op off macOS, or when duti or VSCodium.app is missing.
# Terminal $EDITOR/$VISUAL remain nvim.
- shell:
  - description: Set VSCodium as default app for code/text files (macOS, duti)
    command: |
      if [ "$(uname)" = Darwin ] && command -v duti >/dev/null 2>&1 && open -Ra VSCodium >/dev/null 2>&1; then
        duti ~/.config/duti/vscodium.duti || echo "warning: duti could not apply ~/.config/duti/vscodium.duti" >&2
      fi
    quiet: true
    stdout: true
    stderr: true

# ── Mise ───────────────────────────────────────────────────────────────────────
# dotbot-mise plugin: runs `mise install`.
# The plugin ignores YAML data; empty list satisfies the key.
# Ordering: brewfile: has already installed mise; link: has already established
# ~/.config/mise/config.toml so mise install finds its XDG-default config.
- mise: []

# ── Post-link ──────────────────────────────────────────────────────────────────
# Build bat's binary cache after all symlinks are in place.
# Guarded: no-op when bat is absent (|| true prevents dotbot aborting the run).
- shell:
  - description: Build bat cache (no-op when bat is absent)
    command: command -v bat >/dev/null 2>&1 && bat cache --build >/dev/null 2>&1 || true
    quiet: true
    stdout: true
    stderr: true

# ── Cleanup ────────────────────────────────────────────────────────────────────
# Note: dead-symlink cleanup is owned by `./dots clean` (commands/clean.sh)
# which enumerates broken symlinks via `find -maxdepth 1 -type l` across the
# managed directories and `rm -f`s each. We do NOT use dotbot's stock
# `clean:` directive here because its handle() raises an exception on
# macOS Tahoe when iterating `$HOME` (some filesystem privacy boundary).
